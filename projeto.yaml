landing:
  depoimentos:
  - nome: Mauricio
    texto: Gostei muito do atendimento da CRD! Minha moto apresentou um problema durante o passeio e precisei
      de um guincho. Fui muito bem atendido, o Cláudio foi atencioso, chegou dentro do prazo combinado
      e transportou minha moto com todo cuidado. O preço foi justo e fiquei muito satisfeito com o serviço.
      Recomendo a CRD Moto Resgate!
    origem: Depoimento enviado pelo cliente.
    observacao_publicacao: Confirmar autorização do cliente para divulgar seu nome e depoimento em canais
      públicos.
design_system:
  briefing: Design System para landing page institucional e comercial da CRD Moto Resgate, com foco mobile-first
    e conversão de motociclistas que precisam de resgate ou transporte especializado para contato pelo
    WhatsApp.
  personalidade:
    raio: Suave — 12px
    densidade: Confortável
    sombra: Sutil
  largura_maxima: 1120px
  plano_recomendado: Não se aplica — serviço sob orçamento
  regras:
  - Priorizar mobile-first, leitura rápida e contato pelo WhatsApp; manter alvos de toque com pelo menos
    44px e foco visível.
  - Usar exclusivamente a paleta oficial, as cores de apoio documentadas e as famílias Saira Condensed
    e IBM Plex Sans; não criar novas cores ou fontes.
  - Não inventar preços, planos, avaliações, depoimentos ou promessas; preservar a comunicação especializada,
    próxima, ágil e objetiva da CRD.
  decisoes:
  - decisao: Raio suave de 12px
    por_que: Equilibra a personalidade forte e profissional da CRD com uma interface acessível e acolhedora.
      Aplicar a botões, campos, cartões e containers.
  - decisao: Densidade confortável
    por_que: Facilita a leitura no celular em uma situação de urgência, reduz a sobrecarga de informação
      e mantém o CTA do WhatsApp fácil de localizar.
  - decisao: Sombra sutil
    por_que: Cria hierarquia e separação entre superfícies sem competir com a logomarca, o vermelho e
      a fotografia real da operação.
  cores_apoio:
    superficie: '#FFFFFF'
    superficie_secundaria: '#E8EAEE'
    borda: '#80858E'
    texto_suave: '#595F66'
    cta_hover: '#8F061B'
    foco: '#C8102E'
    erro: '#A80720'
    sucesso: '#3B3F45'
  observacoes_tecnicas:
  - 'A cor de borda #80858E foi escolhida em vez de #858A93 porque a primeira atinge contraste superior
    a 3:1 sobre a superfície secundária #E8EAEE; #858A93 não atinge esse limite.'
  - A escala de espaçamentos de 4px e a sombra CSS sutil são convenções de implementação para operacionalizar
    as decisões aprovadas; não alteram a identidade e podem ser refinadas em uma revisão futura.
  - O token de sucesso utiliza grafite neutro para não introduzir uma cor fora da paleta. A mensagem deve
    sempre incluir texto e ícone, não depender apenas da cor.

link_conversa: ''
produto:
  nome: Serviço de resgate e transporte especializado de motocicletas
  marca: CRD Moto Resgate
  promessa: Sua moto transportada com segurança, atendimento 24 horas e preço justo.
  o_que_e: Serviço especializado exclusivamente em resgate e transporte de motocicletas, com atendimento
    24 horas em São Paulo capital, Grande São Paulo e regiões próximas.
  problema: Atende motociclistas que, por algum imprevisto, não conseguem continuar seu trajeto e precisam
    transportar a motocicleta com segurança até outro destino ou oficina.
  diferenciais:
  - titulo: Atendimento 24 horas
    texto: Disponibilidade para atender solicitações de resgate e transporte de motocicletas a qualquer
      hora.
  - titulo: Especialização em motocicletas
    texto: Atuação exclusiva com resgate e transporte de motos.
  - titulo: Equipamentos Rico Racer
    texto: Utilização de equipamentos especializados Rico Racer, considerados pelo responsável pela empresa
      um diferencial importante para o transporte seguro das motocicletas.
  planos:
  - nome: Resgate e transporte sob orçamento
    preco: Variável; não há preço único informado.
    descricao: O valor é calculado principalmente conforme a quilometragem. Dia, horário e duração operacional
      do transporte também podem influenciar o orçamento.
  o_que_nao_faz: A CRD Moto Resgate não realiza manutenção nem conserto mecânico de motocicletas. Em algumas
    situações, pode auxiliar pontualmente com chupeta de bateria ou entrega de combustível, mas o serviço
    principal é o resgate e transporte.
  vende_para: B2C — atendimento direto a pessoas físicas.
  o_que_ja_observo:
    publicos:
    - Motociclistas que utilizam a moto para lazer e passeios.
    - Motociclistas que sofreram acidentes e precisam transportar a motocicleta.
    - Motociclistas que tiveram problemas mecânicos e precisam de transporte.
    preocupacoes:
    - Preço do transporte.
    - Rapidez para o atendimento chegar.
    - Segurança durante o transporte da motocicleta.
    canais:
    - WhatsApp
    - Google Ads
    - Site da empresa
    - 'Instagram: publicações orgânicas e impulsionadas'
    - Grupos de Facebook
    - Indicações
    problema_de_conversao: A demora para responder ou confirmar o serviço pode levar o cliente a desistir,
      encontrar outra maneira de resolver o problema ou contratar outro serviço.
    dados_indisponiveis:
    - CRM estruturado
    - Pesquisa formal com clientes
    - Entrevistas organizadas
    - Histórico estruturado de vendas
    - Estatísticas confiáveis sobre perfil, comportamento e decisão de compra
persona:
  icp:
    setor: ''
    porte: ''
    gatilho: ''
  quem_usa: Motociclista que utiliza a moto para lazer e passeios e enfrenta um imprevisto que interrompe
    o trajeto.
  manchete: Motociclista que gosta de fazer passeios, mas pode ter sua viagem interrompida por um imprevisto
    e precisa de uma empresa que chegue rápido, transporte sua moto com segurança e cobre um preço justo.
  fala: Cara, minha moto parou no meio do passeio e preciso de alguém que venha rápido, transporte ela
    com segurança e cobre um preço justo. Não quero ficar parado esperando nem correr o risco de danificar
    minha moto.
  dor: Ter o passeio ou trajeto interrompido e precisar encontrar rapidamente um serviço confiável para
    transportar a motocicleta com segurança e preço justo.
  jtbd: Quero retomar o controle da situação e levar minha motocicleta até o destino necessário sem ficar
    esperando por muito tempo nem correr o risco de danificá-la durante o transporte.
  oferta: Resgate e transporte especializado de motocicletas, com atendimento 24 horas, equipamentos Rico
    Racer e orçamento conforme o trajeto.
  caminho: O motociclista enfrenta um imprevisto, procura uma opção de resgate, entra em contato com a
    CRD pelo WhatsApp ou outro canal, informa localização e destino, recebe um orçamento e confirma o
    atendimento.
  cena: Durante um passeio, a motocicleta apresenta um problema ou sofre um imprevisto e o motociclista
    não consegue continuar. Ele precisa decidir como retirar a moto do local e levá-la a outro destino
    ou oficina. Procura um serviço de resgate e compara rapidez, segurança e preço. Entra em contato com
    a CRD e precisa receber retorno e confirmação sem demora.
  contradicao: ''
  mapa_empatia:
    diz: Precisa de alguém que venha rápido, transporte a moto com segurança e cobre um preço justo. A
      fala típica registrada é uma hipótese de persona, não um depoimento real.
    faz: Procura um serviço de resgate, informa localização e destino e solicita orçamento. O comportamento
      específico deve ser validado com entrevistas.
    pensa: Pode se preocupar com o tempo de espera, o preço e a possibilidade de a moto ser danificada
      durante o transporte. Inferência a validar.
    sente: Pode sentir preocupação, frustração ou ansiedade por ter o passeio interrompido. Inferência
      a validar.
  retrato:
  - dimensao: Gatilho de entrada
    o_que_sabemos: Um imprevisto impede o motociclista de continuar o trajeto e ele precisa transportar
      a moto.
    origem: informei
    evidencia: Descrição do problema que o serviço resolve.
  - dimensao: Dor
    o_que_sabemos: Precisa transportar a motocicleta com segurança até outro destino ou oficina.
    origem: informei
    evidencia: Descrição do problema que o serviço resolve.
  - dimensao: Critérios de escolha
    o_que_sabemos: Preço, rapidez de chegada e segurança são preocupações observadas.
    origem: informei
    evidencia: Fatores de preocupação citados pelo responsável pela empresa.
  - dimensao: Evento que acelera a compra
    o_que_sabemos: A impossibilidade de continuar o trajeto aumenta a necessidade de contratar o transporte.
    origem: deduziu
    evidencia: O serviço é procurado quando o motociclista não consegue seguir viagem.
  - dimensao: Disposição a pagar
    o_que_sabemos: O cliente recebe orçamento calculado principalmente pela quilometragem, com influência
      possível do dia, horário e duração operacional.
    origem: informei
    evidencia: Modelo de precificação descrito pela empresa; limite de preço aceito pelo cliente a medir.
  - dimensao: Confiança
    o_que_sabemos: A segurança é uma preocupação observada; o peso específico dos equipamentos Rico Racer
      na decisão ainda precisa ser validado.
    origem: informei e deduziu
    evidencia: Segurança foi informada como preocupação; efeito do equipamento na escolha é hipótese.
  - dimensao: Gatilho de saída
    o_que_sabemos: A demora para responder ou confirmar pode levar o cliente a desistir ou contratar outro
      serviço.
    origem: informei
    evidencia: Problema de conversão relatado pelo responsável pela empresa.
  risco_do_retrato: A persona prioriza o motociclista de lazer em situação de imprevisto, mas a relevância
    relativa desse grupo frente a motociclistas acidentados ou com problemas mecânicos ainda precisa ser
    validada. Também é necessário validar o peso real da rapidez e do equipamento Rico Racer na decisão.
  decisoes:
    por_que_esta: O motociclista em passeio foi escolhido como persona principal por representar uma situação
      clara de interrupção do trajeto e necessidade de resgate e transporte.
    descartadas:
    - quem: Motociclista que sofre um acidente e precisa transportar a moto
      por_que: É um público observado e potencialmente atendido, mas não foi escolhido como foco principal
        da persona nesta etapa.
    - quem: Motociclista que enfrenta um problema mecânico e precisa de transporte
      por_que: É um público observado e potencialmente atendido, mas não foi escolhido como foco principal
        da persona nesta etapa.
    o_que_mudou: ''
  hipoteses:
  - afirmacao: A rapidez na resposta e na chegada influencia a contratação do serviço.
    se_cair: A comunicação e a operação talvez precisem priorizar outros critérios de decisão, como preço
      ou segurança.
    fonte: Observação sobre preocupação com rapidez e desistência quando há demora. A relação causal ainda
      precisa ser validada.
    passos:
    - Conversar com cinco motociclistas que já precisaram transportar uma moto.
    - 'Perguntar: ''Na última vez que precisou transportar sua moto, o que mais influenciou sua escolha?'''
    - Registrar as respostas.
    prazo: 7 dias; custo baixo, utilizando contatos e WhatsApp.
    confirma_se: Pelo menos 3 das 5 pessoas mencionarem rapidez, tempo de resposta ou previsão de chegada
      como fator importante.
    cai_se: Menos de 3 das 5 pessoas mencionarem rapidez como fator importante.
  - afirmacao: Mostrar o equipamento Rico Racer pode aumentar a confiança e gerar contatos qualificados.
    se_cair: A demonstração do equipamento pode não precisar ocupar posição central na comunicação; outros
      argumentos devem ser investigados.
    fonte: Equipamento informado como diferencial; impacto na confiança ainda é uma dedução.
    passos:
    - 'Publicar dois conteúdos nos canais atuais: um apresentando o serviço e outro mostrando o equipamento
      Rico Racer.'
    - Registrar os contatos qualificados recebidos por cada conteúdo.
    - Comparar os resultados, considerando o alcance das publicações quando disponível.
    prazo: 14 dias; custo baixo, utilizando os canais atuais.
    confirma_se: O conteúdo que demonstra o equipamento gerar mais contatos qualificados do que o conteúdo
      geral, considerando o alcance de cada publicação quando disponível.
    cai_se: Não houver diferença perceptível nos contatos qualificados ou o conteúdo não despertar perguntas
      relacionadas à segurança e ao transporte.
  antipersona:
    criterio: Incompatibilidade entre a necessidade procurada e o serviço que a CRD efetivamente oferece.
    perfis:
    - quem: Pessoas que precisam transportar carros ou outros veículos.
      por_que: A CRD trabalha exclusivamente com motocicletas.
    - quem: Motociclistas que procuram conserto mecânico.
      por_que: A CRD não realiza manutenção nem reparos.
    - quem: Pessoas que procuram apenas o menor preço, independentemente da segurança.
      por_que: A proposta inclui transporte especializado e cuidado com a motocicleta.
    - quem: Clientes que precisam de atendimento fora da área habitual.
      por_que: O deslocamento pode comprometer a disponibilidade e a viabilidade operacional; avaliar
        caso a caso.
  leitura_critica:
    vale_manter: ''
    e_fragil: ''
    proximo_passo: ''

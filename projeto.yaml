marca:
  tom_de_voz:
    atributos:
    - isso: 'Especializada: demonstra conhecimento em resgate e transporte de motocicletas, destacando
        o uso de equipamentos adequados, como o Rico Racer.'
      nao_aquilo: 'Genérica: não se comunica como um guincho que atende qualquer tipo de veículo nem usa
        promessas vagas.'
    - isso: 'Próxima: conversa de forma humana, acolhedora e acessível. Expressões como ''Fica tranquilo,
        a CRD pode te ajudar!'' podem ser usadas habitualmente em todos os canais.'
      nao_aquilo: 'Excessivamente informal: evita gírias em excesso, intimidade forçada ou brincadeiras
        que diminuam a seriedade da situação.'
    - isso: 'Ágil e objetiva: informa o que a pessoa precisa fazer, como solicitar o orçamento e quais
        dados enviar.'
      nao_aquilo: 'Apressada ou fria: não transmite impaciência, não culpa o cliente e não responde de
        forma seca.'
    usar:
    - Resgate e transporte de motocicletas
    - Transporte com segurança, cuidado e equipamentos especializados
    - Atendimento 24 horas em São Paulo e região
    - Orçamento gratuito e sem compromisso
    - Sua moto, seu passeio, conte com a CRD
    - Envie sua localização e o destino pelo WhatsApp
    evitar:
    - O melhor guincho do Brasil
    - Menor preço garantido
    - Chegamos em minutos
    - Segurança 100% garantida
    - Serviço incomparável
    - Solução completa para qualquer problema
    - Preços imbatíveis
    - Não se preocupe com nada
    - A experiência definitiva em transporte
    exemplos:
    - antes: Teve um problema com seu veículo? Temos a solução perfeita para você!
      depois: Sua moto deu problema durante o passeio? Fica tranquilo, a CRD pode te ajudar! Fazemos o
        resgate e transporte da sua motocicleta com segurança, cuidado e equipamentos especializados.
        Atendemos 24 horas em São Paulo e região. Chame a gente pelo WhatsApp e solicite seu orçamento
        gratuito!
    - antes: Trabalhamos com qualidade e excelência para oferecer o melhor serviço do mercado!
      depois: Sua motocicleta merece cuidado no transporte. A CRD utiliza equipamentos especializados
        Rico Racer para realizar o resgate e transporte de motos.
    - antes: Entre em contato agora e aproveite nossas condições imperdíveis!
      depois: Precisa transportar sua moto? Envie sua localização e o destino pelo WhatsApp. A CRD prepara
        seu orçamento sem compromisso.
    cta:
    - Solicite seu orçamento
    - Chame a CRD no WhatsApp
    - Preciso resgatar minha moto
